<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Rhythms School of Dance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
        }

        h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-export {
            background: #4caf50;
            color: white;
        }

        .content {
            padding: 20px;
        }

        .month-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .month-btn {
            flex: 1;
            min-width: 80px;
            padding: 12px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9em;
            color: #667eea;
            font-weight: 600;
        }

        .month-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .calendar-container {
            display: none;
        }

        .calendar-container.active {
            display: block;
        }

        .calendar-header {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .month-year {
            font-size: 1.8em;
            font-weight: 700;
            color: #667eea;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .day-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            border-radius: 10px;
            font-size: 0.9em;
        }

        .calendar-day {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
            min-height: 120px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .calendar-day:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }

        .calendar-day.weekend {
            background: #f8f9ff;
        }

        .calendar-day.empty {
            background: #f5f5f5;
            border: 2px dashed #ddd;
            cursor: default;
        }

        .calendar-day.empty:hover {
            transform: none;
            box-shadow: none;
        }

        .calendar-day.has-bookings {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-color: #4caf50;
        }

        .day-number {
            font-weight: 700;
            font-size: 1.2em;
            color: #333;
            margin-bottom: 8px;
        }

        .day-type {
            font-size: 0.75em;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .booking-count {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
            display: inline-block;
            margin-top: 5px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.3s;
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.3em;
            font-weight: 600;
        }

        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 20px;
        }

        .booking-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
        }

        .booking-item:last-child {
            margin-bottom: 0;
        }

        .parent-name {
            font-weight: 700;
            font-size: 1.1em;
            color: #333;
            margin-bottom: 5px;
        }

        .child-name {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .time-slot {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: 600;
            margin: 3px;
        }

        .time-slot.na {
            background: #999;
        }

        .no-bookings {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .calendar-grid {
                gap: 5px;
            }

            .calendar-day {
                min-height: 80px;
                padding: 8px;
            }

            .day-number {
                font-size: 1em;
            }

            .modal-content {
                width: 95%;
                max-height: 90vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="logo">💃</div>
                <div>
                    <h1>Admin Dashboard</h1>
                    <p class="subtitle">Calendar View</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="window.location.href='/'">Parent View</button>
                <button class="btn btn-export" onclick="exportToCSV()">Export CSV</button>
                <button class="btn btn-primary" onclick="refreshData()">Refresh</button>
            </div>
        </div>

        <div class="content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalParents">0</div>
                    <div class="stat-label">Total Families</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalBookings">0</div>
                    <div class="stat-label">Total Bookings</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="weekdayAvail">0</div>
                    <div class="stat-label">Weekday Slots</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="weekendAvail">0</div>
                    <div class="stat-label">Weekend Slots</div>
                </div>
            </div>

            <div class="month-selector">
                <button class="month-btn active" onclick="showMonth('may')">May</button>
                <button class="month-btn" onclick="showMonth('june')">June</button>
                <button class="month-btn" onclick="showMonth('july')">July</button>
                <button class="month-btn" onclick="showMonth('august')">August</button>
            </div>

            <div id="may" class="calendar-container active">
                <div class="calendar-header">
                    <div class="month-year">May 2026</div>
                </div>
                <div class="calendar-grid" id="may-calendar"></div>
            </div>

            <div id="june" class="calendar-container">
                <div class="calendar-header">
                    <div class="month-year">June 2026</div>
                </div>
                <div class="calendar-grid" id="june-calendar"></div>
            </div>

            <div id="july" class="calendar-container">
                <div class="calendar-header">
                    <div class="month-year">July 2026</div>
                </div>
                <div class="calendar-grid" id="july-calendar"></div>
            </div>

            <div id="august" class="calendar-container">
                <div class="calendar-header">
                    <div class="month-year">August 2026</div>
                </div>
                <div class="calendar-grid" id="august-calendar"></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Bookings</div>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Bookings will be inserted here -->
            </div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        let allData = [];
        const months = {
            may: { name: 'May', year: 2026, days: 31, startDay: 4 },
            june: { name: 'June', year: 2026, days: 30, startDay: 0 },
            july: { name: 'July', year: 2026, days: 31, startDay: 3 },
            august: { name: 'August', year: 2026, days: 31, startDay: 6 }
        };
        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        async function loadAvailability() {
            try {
                const data = await DB.getAll();
                allData = data;
                return data;
            } catch (error) {
                console.error('Error:', error);
                return [];
            }
        }

        function generateCalendar(monthKey) {
            const month = months[monthKey];
            const grid = document.getElementById(`${monthKey}-calendar`);
            grid.innerHTML = '';

            // Day headers
            dayNames.forEach(day => {
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                grid.appendChild(header);
            });

            // Empty cells before month starts
            for (let i = 0; i < month.startDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day empty';
                grid.appendChild(emptyDay);
            }

            // Days of month
            for (let day = 1; day <= month.days; day++) {
                const dayOfWeek = (month.startDay + day - 1) % 7;
                const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                
                const dayDiv = document.createElement('div');
                dayDiv.className = `calendar-day ${isWeekend ? 'weekend' : ''}`;
                
                // Get bookings for this day
                const bookings = getBookingsForDay(monthKey, day);
                
                if (bookings.length > 0) {
                    dayDiv.classList.add('has-bookings');
                }
                
                dayDiv.innerHTML = `
                    <div class="day-number">${day}</div>
                    <div class="day-type">${dayNames[dayOfWeek]}</div>
                    ${bookings.length > 0 ? `<div class="booking-count">${bookings.length} booking${bookings.length > 1 ? 's' : ''}</div>` : ''}
                `;
                
                if (bookings.length > 0) {
                    dayDiv.onclick = () => showBookings(monthKey, day, bookings);
                }
                
                grid.appendChild(dayDiv);
            }
        }

        function getBookingsForDay(month, day) {
            const bookings = [];
            
            allData.forEach(parent => {
                if (parent.selections && parent.selections[month] && parent.selections[month][day]) {
                    bookings.push({
                        parentName: parent.parentName,
                        childName: parent.childName,
                        timeSlots: parent.selections[month][day],
                        id: parent.id
                    });
                }
            });
            
            return bookings;
        }

        function showBookings(month, day, bookings) {
            const monthName = months[month].name;
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            
            modalTitle.textContent = `${monthName} ${day}, 2026`;
            
            if (bookings.length === 0) {
                modalBody.innerHTML = '<div class="no-bookings">No bookings for this day</div>';
            } else {
                let html = '';
                bookings.forEach(booking => {
                    html += `
                        <div class="booking-item">
                            <div class="parent-name">${booking.parentName}</div>
                            <div class="child-name">Child: ${booking.childName}</div>
                            <div>
                                ${booking.timeSlots.map(slot => 
                                    `<span class="time-slot ${slot === 'N/A' ? 'na' : ''}">${slot}</span>`
                                ).join('')}
                            </div>
                        </div>
                    `;
                });
                modalBody.innerHTML = html;
            }
            
            document.getElementById('bookingModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('bookingModal').classList.remove('show');
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('bookingModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        function showMonth(month) {
            document.querySelectorAll('.calendar-container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(month).classList.add('active');
            event.target.classList.add('active');
        }

        async function updateStats() {
            const data = await loadAvailability();
            
            document.getElementById('totalParents').textContent = data.length;
            
            let totalBookings = 0;
            let weekdayCount = 0;
            let weekendCount = 0;
            
            data.forEach(parent => {
                Object.keys(parent.selections || {}).forEach(month => {
                    Object.keys(parent.selections[month]).forEach(day => {
                        totalBookings++;
                        parent.selections[month][day].forEach(slot => {
                            if (slot.includes('6-8')) {
                                weekdayCount++;
                            } else if (slot.includes('AM') || slot.includes('PM')) {
                                weekendCount++;
                            }
                        });
                    });
                });
            });
            
            document.getElementById('totalBookings').textContent = totalBookings;
            document.getElementById('weekdayAvail').textContent = weekdayCount;
            document.getElementById('weekendAvail').textContent = weekendCount;
        }

        async function refreshData() {
            await loadAvailability();
            await updateStats();
            
            // Regenerate all calendars
            Object.keys(months).forEach(monthKey => {
                generateCalendar(monthKey);
            });
        }

        async function exportToCSV() {
            const data = await loadAvailability();
            
            let csv = 'Parent Name,Child Name,Month,Day,Time Slot,Submitted Date\n';
            
            data.forEach(parent => {
                const submittedDate = new Date(parent.created_at || parent.createdAt).toLocaleDateString();
                Object.keys(parent.selections || {}).forEach(month => {
                    Object.keys(parent.selections[month]).forEach(day => {
                        parent.selections[month][day].forEach(slot => {
                            csv += `"${parent.parentName}","${parent.childName}","${month}","${day}","${slot}","${submittedDate}"\n`;
                        });
                    });
                });
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `availability-export-${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // Initialize on load
        window.addEventListener('load', async () => {
            await refreshData();
        });
    </script>
</body>
</html>
