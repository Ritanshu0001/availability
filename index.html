<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythms School of Dance - Parent Availability</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            padding: 20px;
            text-align: center;
            color: white;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            font-size: 1.5em;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 0.95em;
            opacity: 0.95;
        }

        .content {
            padding: 20px;
        }

        .parent-info {
            background: #fff5f0;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #ffe8e0;
        }

        .parent-info h2 {
            color: #ff6b6b;
            font-size: 1.2em;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff8e53;
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }

        .month-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .month-btn {
            flex: 1;
            min-width: 80px;
            padding: 12px;
            background: white;
            border: 2px solid #ff8e53;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
            color: #ff6b6b;
            font-weight: 600;
            white-space: nowrap;
        }

        .month-btn:active {
            transform: scale(0.95);
        }

        .month-btn.active {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            border-color: #ff6b6b;
        }

        .calendar-container {
            display: none;
        }

        .calendar-container.active {
            display: block;
        }

        .calendar-header {
            background: linear-gradient(135deg, #fff5f0, #ffe8e0);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .month-year {
            font-size: 1.3em;
            font-weight: 700;
            color: #ff6b6b;
            text-align: center;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 20px;
        }

        .day-header {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            padding: 8px 2px;
            text-align: center;
            font-weight: 600;
            border-radius: 8px;
            font-size: 0.75em;
        }

        .calendar-day {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 8px 4px;
            min-height: 100px;
            transition: all 0.3s;
            position: relative;
        }

        .calendar-day.weekend {
            background: #fff5e6;
            border-color: #ffb366;
        }

        .calendar-day.empty {
            background: #f5f5f5;
            border: 2px dashed #ddd;
        }

        .day-number {
            font-weight: 700;
            font-size: 1em;
            color: #333;
            margin-bottom: 5px;
            text-align: center;
        }

        .day-type {
            font-size: 0.65em;
            color: #666;
            margin-bottom: 5px;
            text-align: center;
            text-transform: uppercase;
        }

        .time-options {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .time-option input[type="checkbox"] {
            display: none;
        }

        .time-option label {
            display: block;
            padding: 6px 4px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.65em;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .time-option label:active {
            transform: scale(0.95);
        }

        .time-option input[type="checkbox"]:checked + label {
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            border-color: #ff6b6b;
            font-weight: 600;
        }

        .time-option input[type="checkbox"]:checked + label::after {
            content: ' ✓';
        }

        .not-available-option label {
            background: #f5f5f5;
            border: 1px dashed #999;
            color: #666;
        }

        .not-available-option input[type="checkbox"]:checked + label {
            background: #757575;
            border-color: #555;
            color: white;
        }

        .submit-section {
            margin-top: 30px;
            text-align: center;
            padding-top: 20px;
            border-top: 2px solid #ffe8e0;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.3);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .admin-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #ffe8e0;
        }

        .admin-link a {
            color: #ff6b6b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9em;
        }

        .success-message, .error-message {
            display: none;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .success-message {
            background: #4caf50;
            color: white;
        }

        .error-message {
            background: #f44336;
            color: white;
        }

        .success-message.show, .error-message.show {
            display: block;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 900px;
            }

            .calendar-grid {
                gap: 8px;
            }

            .calendar-day {
                min-height: 120px;
                padding: 10px 6px;
            }

            .time-option label {
                font-size: 0.75em;
                padding: 8px 6px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="logo.png" alt="Rhythms School of Dance Logo">
            </div>
            <h1>Rhythms School of Dance</h1>
            <p class="subtitle">Parent Availability Calendar</p>
        </div>

        <div class="content">
            <div class="success-message" id="successMessage">
                ✓ Your availability has been saved successfully!
            </div>

            <div class="error-message" id="errorMessage">
                ✗ <span id="errorText"></span>
            </div>

            <div class="parent-info">
                <h2>Your Information</h2>
                <div class="form-group">
                    <label for="parentName">Parent Name *</label>
                    <input type="text" id="parentName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="childName">Child's Name *</label>
                    <input type="text" id="childName" placeholder="Enter child's name" required>
                </div>
            </div>

            <div class="month-selector">
                <button class="month-btn active" onclick="showMonth('may')">May</button>
                <button class="month-btn" onclick="showMonth('june')">June</button>
                <button class="month-btn" onclick="showMonth('july')">July</button>
                <button class="month-btn" onclick="showMonth('august')">Aug</button>
            </div>

            <div id="may" class="calendar-container active">
                <div class="calendar-header">
                    <div class="month-year">May 2026</div>
                </div>
                <div class="calendar-grid" id="may-calendar"></div>
            </div>

            <div id="june" class="calendar-container">
                <div class="calendar-header">
                    <div class="month-year">June 2026</div>
                </div>
                <div class="calendar-grid" id="june-calendar"></div>
            </div>

            <div id="july" class="calendar-container">
                <div class="calendar-header">
                    <div class="month-year">July 2026</div>
                </div>
                <div class="calendar-grid" id="july-calendar"></div>
            </div>

            <div id="august" class="calendar-container">
                <div class="calendar-header">
                    <div class="month-year">August 2026</div>
                </div>
                <div class="calendar-grid" id="august-calendar"></div>
            </div>

            <div class="submit-section">
                <button class="submit-btn" onclick="submitAvailability()" id="submitBtn">Submit Availability</button>
            </div>

            <div class="admin-link">
                <a href="/admin">Admin Login →</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '';

        const CACHE_KEY = "rhythms_parent_availability";

        function saveCache() {
            const parentName = document.getElementById("parentName").value;
            const childName = document.getElementById("childName").value;

            const checked = [];
            document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
                checked.push(cb.id);
            });

            localStorage.setItem(CACHE_KEY, JSON.stringify({
                parentName,
                childName,
                checked
            }));
        }

        function loadCache() {
            const saved = localStorage.getItem(CACHE_KEY);
            if (!saved) return;

            const data = JSON.parse(saved);

            document.getElementById("parentName").value = data.parentName || "";
            document.getElementById("childName").value = data.childName || "";

            if (Array.isArray(data.checked)) {
                data.checked.forEach(id => {
                    const cb = document.getElementById(id);
                    if (cb) cb.checked = true;
                });
            }
        }

        function clearCache() {
            localStorage.removeItem(CACHE_KEY);
        }

        const months = {
            may: { name: 'May', year: 2026, days: 31, startDay: 4 },
            june: { name: 'June', year: 2026, days: 30, startDay: 0 },
            july: { name: 'July', year: 2026, days: 31, startDay: 3 },
            august: { name: 'August', year: 2026, days: 31, startDay: 6 }
        };

        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        function generateCalendar(monthKey) {
            const month = months[monthKey];
            const grid = document.getElementById(`${monthKey}-calendar`);
            grid.innerHTML = '';

            dayNames.forEach(day => {
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                grid.appendChild(header);
            });

            for (let i = 0; i < month.startDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day empty';
                grid.appendChild(emptyDay);
            }

            for (let day = 1; day <= month.days; day++) {
                const dayOfWeek = (month.startDay + day - 1) % 7;
                const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                
                const dayDiv = document.createElement('div');
                dayDiv.className = `calendar-day ${isWeekend ? 'weekend' : ''}`;
                
                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = day;
                
                const dayType = document.createElement('div');
                dayType.className = 'day-type';
                dayType.textContent = dayNames[dayOfWeek];
                
                const timeOptions = document.createElement('div');
                timeOptions.className = 'time-options';
                
                if (isWeekend) {
                    const slots = ['10AM-12PM', '12PM-4PM', '4PM-6PM'];
                    slots.forEach(slot => {
                        const option = createTimeOption(`${monthKey}-${day}-${slot}`, slot);
                        timeOptions.appendChild(option);
                    });
                } else {
                    const option = createTimeOption(`${monthKey}-${day}-6-8`, '6-8 PM');
                    timeOptions.appendChild(option);
                }
                
                const naOption = createTimeOption(`${monthKey}-${day}-na`, 'N/A', true);
                timeOptions.appendChild(naOption);
                
                dayDiv.appendChild(dayNumber);
                dayDiv.appendChild(dayType);
                dayDiv.appendChild(timeOptions);
                grid.appendChild(dayDiv);
            }
        }

        function createTimeOption(id, label, isNA = false) {
            const div = document.createElement('div');
            div.className = `time-option ${isNA ? 'not-available-option' : ''}`;
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = id;
            
            const labelEl = document.createElement('label');
            labelEl.htmlFor = id;
            labelEl.textContent = label;
            
            div.appendChild(checkbox);
            div.appendChild(labelEl);
            
            return div;
        }

        function showMonth(month) {
            document.querySelectorAll('.calendar-container').forEach(container => {
                container.classList.remove('active');
            });
            
            document.querySelectorAll('.month-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(month).classList.add('active');
            event.target.classList.add('active');
        }

        function showMessage(type, text) {
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            successMsg.classList.remove('show');
            errorMsg.classList.remove('show');
            
            if (type === 'success') {
                successMsg.classList.add('show');
                setTimeout(() => successMsg.classList.remove('show'), 3000);
            } else {
                document.getElementById('errorText').textContent = text;
                errorMsg.classList.add('show');
                setTimeout(() => errorMsg.classList.remove('show'), 5000);
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function submitAvailability() {
            const parentName = document.getElementById('parentName').value.trim();
            const childName = document.getElementById('childName').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            if (!parentName || !childName) {
                showMessage('error', 'Please fill in all required fields');
                return;
            }

            const availability = {
                parentName,
                childName,
                selections: {}
            };

            // Collect selected times
            document.querySelectorAll('input[type="checkbox"]:checked').forEach(checkbox => {
                const [month, day] = checkbox.id.split('-');
                const label = checkbox.nextElementSibling.textContent.trim();
                
                if (!availability.selections[month]) availability.selections[month] = {};
                if (!availability.selections[month][day]) availability.selections[month][day] = [];
                availability.selections[month][day].push(label);
            });

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                await DB.add(availability);
                showMessage('success', '');
                document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => cb.checked = false);
                document.getElementById('parentName').value = '';
                document.getElementById('childName').value = '';
                clearCache();
            } catch (error) {
                console.error('Error:', error);
                showMessage('error', 'Failed to submit. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Availability';
            }
        }

        Object.keys(months).forEach(monthKey => {
            generateCalendar(monthKey);
        });

        loadCache();

        document.addEventListener("input", saveCache);
        document.addEventListener("change", saveCache);
    </script>
    <script src="supabase-config.js"></script>
</body>
</html>
